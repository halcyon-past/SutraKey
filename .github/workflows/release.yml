name: Publish Release & DMG Installer

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
    inputs:
      custom_message:
        description: 'Optional announcement message (displayed directly after the heading)'
        required: false
        type: string
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build, Package & Publish Release
    runs-on: macos-14
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout Merged Main Branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract Current App Version
        id: version
        shell: bash
        run: |
          VERSION=$(grep 'static let version =' Sources/SutraKey/Models/AppConstants.swift | sed -E 's/.*"([^"]+)".*/\1/' | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "❌ ERROR: Could not extract version from Sources/SutraKey/Models/AppConstants.swift!"
            exit 1
          fi
          echo "CURRENT_VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV
          echo "📌 Current version identified: $VERSION (Tag: v$VERSION)"

      - name: Check Release Existence & Determine Mode
        id: check-version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 Checking if release $TAG_NAME already exists in ${{ github.repository }}..."

          if gh release view "$TAG_NAME" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "ℹ️ Release $TAG_NAME already exists on GitHub."
            echo "🛑 The version in AppConstants.swift ($CURRENT_VERSION) has NOT been changed."
            echo "⏭️ Skipping release creation. No new release will take place until the version is incremented."
            echo "is_new_release=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Verified: $TAG_NAME is a new, unpublished version! Proceeding with full release build."
            echo "is_new_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Validate CHANGELOG.md Entry for Version
        if: steps.check-version.outputs.is_new_release == 'true'
        shell: bash
        run: |
          echo "🔍 Checking that CHANGELOG.md documents version $CURRENT_VERSION..."
          if ! grep -q "## \[${CURRENT_VERSION}\]" CHANGELOG.md; then
            echo "::error::Release notes for version $CURRENT_VERSION are missing from CHANGELOG.md!"
            echo "❌ THE RELEASE WAS HALTED: CHANGELOG.md does not contain a '## [$CURRENT_VERSION]' entry."
            echo "Please add '## [$CURRENT_VERSION] - YYYY-MM-DD' with release notes in CHANGELOG.md before releasing."
            exit 1
          fi
          echo "✅ Verified: CHANGELOG.md contains release notes for version $CURRENT_VERSION."

      - name: Select Xcode 16 (Swift 6)
        if: steps.check-version.outputs.is_new_release == 'true'
        run: |
          XCODE_LATEST=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_LATEST" ]; then
            echo "Selecting $XCODE_LATEST"
            sudo xcode-select -s "$XCODE_LATEST"
          fi
          swift --version

      - name: Set Up Python
        if: steps.check-version.outputs.is_new_release == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        if: steps.check-version.outputs.is_new_release == 'true'
        run: |
          pip install --upgrade pip
          pip install pillow numpy

      - name: Verify Icons & Build ICNS
        if: steps.check-version.outputs.is_new_release == 'true'
        shell: bash
        run: |
          python3 Scripts/generate_icons.py
          bash Scripts/build_icns.sh

      - name: Execute Automated Test Suites
        if: steps.check-version.outputs.is_new_release == 'true'
        shell: bash
        run: |
          swift test

      - name: Build Signed App & Package Installer DMG
        if: steps.check-version.outputs.is_new_release == 'true'
        shell: bash
        run: |
          chmod +x ./Scripts/package_dmg.sh
          ./Scripts/package_dmg.sh

      - name: Verify Release Artifacts & Compute DMG SHA-256
        if: steps.check-version.outputs.is_new_release == 'true'
        shell: bash
        run: |
          for file in "build/SutraKey.dmg" "build/SutraKey-v$CURRENT_VERSION.dmg" "build/SutraKey.zip" "build/SutraKey-v$CURRENT_VERSION.zip"; do
            if [ ! -f "$file" ]; then
              echo "::error::$file was not generated!"
              exit 1
            fi
          done
          ls -lh build/*.dmg build/*.zip
          DMG_SHA256=$(shasum -a 256 "build/SutraKey-v$CURRENT_VERSION.dmg" | awk '{print $1}')
          echo "DMG_SHA256=$DMG_SHA256" >> $GITHUB_ENV
          echo "🔐 Computed DMG SHA-256: $DMG_SHA256"

      - name: Generate Formatted Release Notes
        if: steps.check-version.outputs.is_new_release == 'true'
        shell: bash
        env:
          CUSTOM_MESSAGE: ${{ github.event.inputs.custom_message }}
        run: |
          chmod +x ./Scripts/generate_release_notes.py
          python3 Scripts/generate_release_notes.py \
            --version "$CURRENT_VERSION" \
            --custom-message "$CUSTOM_MESSAGE" \
            --changelog "CHANGELOG.md" \
            --output "RELEASE_NOTES.md" \
            --repo "${{ github.repository }}"

      - name: Publish GitHub Release & Upload Assets
        if: steps.check-version.outputs.is_new_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Publishing GitHub Release $TAG_NAME and attaching DMG and ZIP installers..."
          gh release create "$TAG_NAME" \
            "build/SutraKey.dmg#SutraKey.dmg (Latest Direct Download)" \
            "build/SutraKey-v$CURRENT_VERSION.dmg#SutraKey-v$CURRENT_VERSION.dmg" \
            "build/SutraKey.zip#SutraKey.zip (In-Place Auto-Updater)" \
            "build/SutraKey-v$CURRENT_VERSION.zip#SutraKey-v$CURRENT_VERSION.zip" \
            --title "SutraKey v$CURRENT_VERSION" \
            --notes-file "RELEASE_NOTES.md"

      - name: Synchronize Homebrew Cask (Local + halcyon-past/homebrew-tap)
        if: steps.check-version.outputs.is_new_release == 'true'
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./Scripts/sync_homebrew_tap.py
          python3 ./Scripts/sync_homebrew_tap.py \
            --version "$CURRENT_VERSION" \
            --sha256 "$DMG_SHA256"

          # Commit & sync back to main, uat, and dev only if local files changed
          if ! git diff --quiet Casks/sutrakey.rb; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Casks/sutrakey.rb
            git commit -m "chore(release): auto-sync v$CURRENT_VERSION DMG SHA-256 [skip ci]"
            git push origin HEAD:main
            git fetch origin uat dev
            git push origin HEAD:uat || true
            git push origin HEAD:dev || true
            echo "✅ Synced updated SHA-256 checksum across main, uat, and dev."
          else
            echo "✅ Local Cask already contains the latest SHA-256; no extra commit needed."
          fi
