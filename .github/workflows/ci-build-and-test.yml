name: CI Build & Test

on:
  push:
    branches: [main, uat, dev]
  pull_request:
    branches: [main, uat, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Build, Test & Verify Icons
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Select Xcode 16 (Swift 6)
        run: |
          XCODE_LATEST=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_LATEST" ]; then
            echo "Selecting $XCODE_LATEST"
            sudo xcode-select -s "$XCODE_LATEST"
          fi
          swift --version

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install pillow numpy

      - name: Verify Procedural Icon Generation Pipeline
        run: |
          python3 Scripts/generate_icons.py
          bash Scripts/build_icns.sh

      - name: Run Swift Build (Debug)
        run: |
          swift build

      - name: Run Swift Tests
        run: |
          swift test

      - name: Run Swift Build (Release)
        run: |
          swift build -c release

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Verify Next.js Web Landing Page Build
        run: |
          cd web
          npm ci
          npm run build
